name: Deploy

on:
  push:
    branches: [master]
  # Daily rebuild so build-time data fetched from the network (GitHub
  # star counts, see templates/_project_links.html) stays current
  # between pushes.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: bash scripts/test.sh
        env:
          # Authenticates the build-time GitHub API star-count requests;
          # unauthenticated calls from shared runner IPs get rate-limited.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
