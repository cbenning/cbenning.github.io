[[projects]]
id = "lanby"
name = "Lanby"
pitch = "Host your services. Not your monitoring."
description = "Lanby is a hosted monitoring service for self-hosters: active probes and passive heartbeats for HTTP, TCP, ICMP, DNS and TLS expiry, plus scheduled jobs that have to check in. A relay container runs inside your network and reports out over outbound HTTPS, so it listens on no ports and response bodies never leave. Alerts route by topic to webhooks, Telegram and more."
category = "monitoring service"
status = "experimental"
tech = ["Docker", "REST API", "TLS"]
site = "https://lanby.dev"
docs = "https://docs.lanby.dev"
art = "/art/lanby.svg"
art_width = 64
art_height = 40
featured = true
order = 2

