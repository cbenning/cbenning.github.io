{% extends "base.html" %}
{% block title %}Tag: {{ term.name }}{% endblock title %}
{% block content %}
<h1>Tag: {{ term.name }}</h1>
<ul class="post-list">
{% for p in term.pages %}
  <li>
    <time datetime="{{ p.date | date(format="%Y-%m-%d") }}">{{ p.date | date(format="%Y-%m-%d") }}</time>
    <a href="{{ p.path }}">{{ p.title }}</a>
  </li>
{% endfor %}
</ul>
{% endblock content %}
