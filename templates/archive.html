{% extends "base.html" %}
{% block title %}{{ page.title }}{% endblock title %}
{% block content %}
<h1>{{ page.title }}</h1>
<ul>
{% set section = get_section(path="posts/_index.md") %}
{% for p in section.pages %}
  <li><a href="{{ p.permalink }}">{{ p.title }}</a></li>
{% endfor %}
</ul>
{% endblock content %}
